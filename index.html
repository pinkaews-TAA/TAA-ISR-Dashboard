<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISR Dashboard - AirAsia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0f1117;--card:#1a1d2e;--card2:#222640;
    --accent:#e31837;--accent2:#ff6b35;--green:#00d4aa;
    --text:#f0f2ff;--muted:#8b8fa8;--border:#2e3155;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;}

  /* CONFIG */
  #configScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .config-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .logo .dot{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .config-box h2{font-size:20px;font-weight:700;}
  .config-box p{color:var(--muted);font-size:13px;margin-top:4px;}
  .field{margin-top:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  .field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;transition:border .2s;}
  .field textarea{resize:vertical;min-height:72px;font-family:monospace;font-size:13px;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .prefilled{color:var(--green);font-size:12px;margin-top:4px;}
  .hint{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.6;}
  .hint a{color:#7b9fff;}
  .btn-primary{width:100%;margin-top:24px;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;}
  .btn-primary:hover{opacity:.85;}
  .divider{border:none;border-top:1px solid var(--border);margin:20px 0;}

  /* DASHBOARD */
  #dashboard{display:none;}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:10px;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .h-dot{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
  .header-title{font-size:16px;font-weight:700;}
  .header-sub{font-size:12px;color:var(--muted);}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sync-info .label{font-size:11px;color:var(--muted);}
  .sync-info .time{font-size:13px;font-weight:600;color:var(--green);}
  .btn-refresh{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn-refresh:hover{background:var(--border);}
  .btn-refresh.spinning svg{animation:spin 1s linear infinite;}
  .btn-settings{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
  .btn-settings:hover{color:var(--text);border-color:var(--text);}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  main{padding:24px;max-width:1200px;margin:0 auto;}
  .date-bar{background:linear-gradient(135deg,var(--accent),#b01228);border-radius:12px;padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;}
  .date-bar .date-value{font-size:18px;font-weight:800;}
  .date-bar .date-label{font-size:13px;opacity:.85;}
  .date-bar .countdown{font-size:12px;opacity:.85;text-align:right;}
  .date-bar .countdown span{font-size:16px;font-weight:700;display:block;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);}
  .stat-card.green::before{background:var(--green);}
  .stat-card.orange::before{background:var(--accent2);}
  .stat-card .s-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .stat-card .s-value{font-size:36px;font-weight:800;margin-top:4px;}
  .stat-card .s-sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;}
  .chart-card h3{font-size:15px;font-weight:700;margin-bottom:4px;}
  .ch-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
  .chart-wrap{position:relative;height:300px;}

  .lb-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;}
  .lb-card h3{font-size:15px;font-weight:700;margin-bottom:4px;}
  .lb-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .lb-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
  .rank-1{background:#ffd700;color:#000}.rank-2{background:#c0c0c0;color:#000}.rank-3{background:#cd7f32;color:#fff}.rank-n{background:var(--card2);color:var(--muted)}
  .lb-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden;}
  .lb-avatar img{width:36px;height:36px;border-radius:50%;}
  .lb-info{flex:1;}
  .lb-name{font-size:14px;font-weight:600;}
  .lb-email{font-size:11px;color:var(--muted);}
  .lb-bar-wrap{flex:2;}
  .lb-bar-bg{background:var(--card2);border-radius:4px;height:8px;overflow:hidden;}
  .lb-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s ease;}
  .lb-count{font-size:20px;font-weight:800;min-width:36px;text-align:right;color:var(--green);}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:16px;}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  .error-box{background:rgba(227,24,55,.1);border:1px solid rgba(227,24,55,.3);border-radius:10px;padding:16px 20px;margin:16px 0;font-size:14px;line-height:1.6;}

  #liveClockBar{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
</style>
</head>
<body>

<!-- CONFIG -->
<div id="configScreen">
  <div class="config-box">
    <div class="logo">
      <div class="dot">AA</div>
      <div><h2>ISR Dashboard Setup</h2><p>AirAsia · Jira Service Management</p></div>
    </div>
    <div class="field">
      <label>Google Apps Script Web App URL</label>
      <textarea id="cfgProxyUrl" placeholder="https://script.google.com/a/macros/airasia.com/s/.../exec"></textarea>
      <div class="hint">วาง URL ที่ได้จาก Deploy → ต้องลงท้ายด้วย <b>/exec</b></div>
    </div>
    <hr class="divider">
    <div class="field"><label>Jira Domain</label><input value="https://airasia.atlassian.net" readonly><div class="prefilled">✓ Pre-filled</div></div>
    <div class="field"><label>Email</label><input value="pinkaews@airasia.com" readonly><div class="prefilled">✓ Pre-filled</div></div>
    <div class="field"><label>Project Key</label><input value="ISR" readonly><div class="prefilled">✓ Pre-filled</div></div>
    <button class="btn-primary" onclick="startDashboard()">🚀 Launch Dashboard</button>
    <button style="width:100%;margin-top:10px;padding:10px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;" onclick="try{localStorage.removeItem('isr_proxy_url')}catch(e){};document.getElementById('cfgProxyUrl').value='';alert('ลบ Config แล้วครับ')">🗑 Clear saved config</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="header-left">
      <div class="h-dot">AA</div>
      <div>
        <div class="header-title">ISR Team Dashboard</div>
        <div class="header-sub">Internal Service Request · Done Tickets Today</div>
      </div>
    </div>
    <div class="header-right">
      <div id="liveClockBar"><div class="live-dot"></div><span id="liveClock"></span></div>
      <div class="sync-info">
        <div class="label">Next sync</div>
        <div class="time" id="nextSyncTime">—</div>
      </div>
      <button class="btn-refresh" id="refreshBtn" onclick="fetchData()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      <button class="btn-settings" onclick="showConfig()">⚙ Settings</button>
    </div>
  </header>
  <main>
    <div class="date-bar">
      <div>
        <div class="date-label">📅 Showing tickets closed today</div>
        <div class="date-value" id="todayLabel">—</div>
      </div>
      <div class="countdown">
        <div>Time elapsed today</div>
        <span id="elapsedTime">—</span>
      </div>
    </div>
    <div id="errorBox"></div>
    <div id="mainContent">
      <div class="loading-wrap"><div class="spinner"></div><div style="color:var(--muted);font-size:14px">Loading...</div></div>
    </div>
  </main>
</div>

<script>
let cfg={}, chart=null, syncTimer=null, nextSyncAt=null, clockInterval=null;

// ===== ฝัง Apps Script URL ตรงนี้เลย =====
const PROXY_URL = 'https://script.google.com/a/macros/airasia.com/s/AKfycbyeczrsBb1h1S6axuznvca4OG-XaaxPSsvyeXAB-s6LgVQ-z5F02Y6MtPwsV92pe8c/exec';

function startDashboard(){
  const url=document.getElementById('cfgProxyUrl').value.trim();
  if(!url||!url.includes('script.google.com')){
    alert('กรุณาวาง Google Apps Script URL ให้ถูกต้องครับ\n(ต้องมี script.google.com และลงท้ายด้วย /exec)');
    return;
  }
  const finalUrl = url.endsWith('/exec') ? url : url+'/exec';
  cfg={proxyUrl: finalUrl};
  try { localStorage.setItem('isr_proxy_url', finalUrl); } catch(e){}
  document.getElementById('configScreen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  startClock();
  fetchData();
  scheduleSyncEveryHour();
}

// Auto-launch ด้วย URL ที่ฝังไว้เลย
window.addEventListener('DOMContentLoaded', ()=>{
  // ลองดู localStorage ก่อน (ถ้าเคย override ไว้)
  let savedUrl = '';
  try { savedUrl = localStorage.getItem('isr_proxy_url') || ''; } catch(e){}
  const finalUrl = savedUrl || PROXY_URL;
  cfg = {proxyUrl: finalUrl};
  document.getElementById('cfgProxyUrl').value = finalUrl;
  // Auto-launch ทันทีโดยไม่ต้องกรอก
  document.getElementById('configScreen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  startClock();
  fetchData();
  scheduleSyncEveryHour();
});

function showConfig(){
  clearInterval(syncTimer);clearInterval(clockInterval);
  try {
    const saved = localStorage.getItem('isr_proxy_url');
    if(saved) document.getElementById('cfgProxyUrl').value = saved;
  } catch(e){}
  document.getElementById('configScreen').style.display='flex';
  document.getElementById('dashboard').style.display='none';
}

function pad(n){return String(n).padStart(2,'0');}

function startClock(){
  if(clockInterval)clearInterval(clockInterval);
  clockInterval=setInterval(()=>{
    const now=new Date();
    document.getElementById('liveClock').textContent=now.toLocaleTimeString('th-TH');
    const s=new Date(now);s.setHours(0,0,0,0);
    const e=now-s;
    const h=Math.floor(e/3600000),m=Math.floor((e%3600000)/60000),sc=Math.floor((e%60000)/1000);
    document.getElementById('elapsedTime').textContent=`${pad(h)}:${pad(m)}:${pad(sc)}`;
    if(nextSyncAt){
      const d=Math.max(0,nextSyncAt-now);
      document.getElementById('nextSyncTime').textContent=`${pad(Math.floor(d/60000))}:${pad(Math.floor((d%60000)/1000))}`;
    }
  },1000);
}

function scheduleSyncEveryHour(){
  if(syncTimer)clearInterval(syncTimer);
  nextSyncAt=new Date(Date.now()+3600000);
  syncTimer=setInterval(()=>{fetchData();nextSyncAt=new Date(Date.now()+3600000);},3600000);
}

function showError(msg){document.getElementById('errorBox').innerHTML=`<div class="error-box">⚠️ ${msg}</div>`;}
function clearError(){document.getElementById('errorBox').innerHTML='';}

function fetchData(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  clearError();

  const now=new Date();
  const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  document.getElementById('todayLabel').textContent=
    now.toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const jql=`filter = 10447 AND status in (Done, Resolved) AND resolutiondate >= "${todayStr} 00:00" AND resolutiondate <= "${todayStr} 23:59" ORDER BY resolutiondate DESC`;
  const cbName='jiraCb_'+Date.now();
  const src=`${cfg.proxyUrl}?jql=${encodeURIComponent(jql)}&maxResults=500&fields=assignee,summary,status,updated,resolutiondate&callback=${cbName}`;

  let settled=false;
  const timer=setTimeout(()=>{
    if(settled)return;
    settled=true;cleanup();
    showError('ดึงข้อมูลไม่ได้: <b>Timeout (15s)</b><br><small>ตรวจสอบ URL ของ Apps Script</small>');
    document.getElementById('mainContent').innerHTML='';
    btn.classList.remove('spinning');
  },15000);

  function cleanup(){
    clearTimeout(timer);
    delete window[cbName];
    const s=document.getElementById('_jsonp');
    if(s)s.remove();
  }

  window[cbName]=(data)=>{
    if(settled)return;
    settled=true;cleanup();
    btn.classList.remove('spinning');
    if(data.errorMessages&&data.errorMessages.length){
      showError(`Jira error: <b>${data.errorMessages[0]}</b>`);
      document.getElementById('mainContent').innerHTML='';
    } else if(data.error){
      showError(`Error: <b>${data.error}</b>`);
      document.getElementById('mainContent').innerHTML='';
    } else {
      // กรองเฉพาะ Ticket ที่ปิดวันนี้จริงๆ (client-side double check)
      const todayIssues = (data.issues||[]).filter(issue => {
        const rd = issue.fields.resolutiondate || issue.fields.updated;
        if(!rd) return false;
        const d = new Date(rd);
        return d.getFullYear()===now.getFullYear() &&
               d.getMonth()===now.getMonth() &&
               d.getDate()===now.getDate();
      });
      renderDashboard(todayIssues, todayStr, now);
    }
  };

  const s=document.createElement('script');
  s.id='_jsonp';
  s.onerror=()=>{
    if(settled)return;
    settled=true;cleanup();
    showError('ดึงข้อมูลไม่ได้: <b>Script load error</b><br><small>ตรวจสอบว่า Deploy Apps Script ถูกต้องและ URL ลงท้ายด้วย /exec</small>');
    document.getElementById('mainContent').innerHTML='';
    btn.classList.remove('spinning');
  };
  s.src=src;
  document.head.appendChild(s);
}

// รายชื่อทีม ISR (ใช้สำหรับ reference เท่านั้น ไม่ใช้ whitelist filter)
const TEAM_EMAILS = [
  'apichonc@airasia.com',
  'chakajwitj@airasia.com',
  'suthidal@airasia.com',
  'parinyay@airasia.com',
  'kittipongta@airasia.com',
  'akkraponk@airasia.com',
  'pisitponkt@airasia.com',
  'keeratis@airasia.com',
  'keeratic@airasia.com',
  'warakorns@airasia.com',
  'archawaphols@airasia.com',
  'jirats@airasia.com',
  'nattapolm@airasia.com'
];

function renderDashboard(issues,todayStr,now){
  const counts={};

  for(const issue of issues){
    const a=issue.fields.assignee;
    if(!a) continue;
    const email = (a.emailAddress||'').toLowerCase();
    // กรองเฉพาะคนในทีมโดยใช้ email
    if(TEAM_EMAILS.length > 0 && !TEAM_EMAILS.some(e => email.includes(e.split('@')[0]))) continue;
    // trim " -" ออกจากชื่อ
    const name = (a.displayName||email||'Unknown').replace(/\s*-\s*$/, '').trim();
    if(!counts[name]) counts[name]={count:0,avatar:a?.avatarUrls?.['48x48']||null,email:a?.emailAddress||''};
    counts[name].count++;
  }
  // เรียงจากมากไปน้อย แสดงเฉพาะคนที่มี ticket > 0
  const sorted=Object.entries(counts).filter(e=>e[1].count>0).sort((a,b)=>b[1].count-a[1].count);
  const total=issues.length,members=sorted.length;
  const top=sorted[0];
  const avg=members>0?(total/members).toFixed(1):0;
  const maxCount=top?top[1].count:1;
  const colors=sorted.map((_,i)=>i===0?'#e31837':i===1?'#ff6b35':i===2?'#ffd700':'#3d4278');

  let html=`
  <div class="stat-row">
    <div class="stat-card"><div class="s-label">Total Done Today</div><div class="s-value">${total}</div><div class="s-sub">Tickets closed today</div></div>
    <div class="stat-card green"><div class="s-label">Active Members</div><div class="s-value">${members}</div><div class="s-sub">People with Done tickets</div></div>
    <div class="stat-card orange"><div class="s-label">Avg per Person</div><div class="s-value">${avg}</div><div class="s-sub">Tickets / member</div></div>
    <div class="stat-card"><div class="s-label">Top Performer</div><div class="s-value" style="font-size:22px;margin-top:6px">${top?top[0].split(' ')[0]:'—'}</div><div class="s-sub">${top?top[1].count+' tickets':'No data'}</div></div>
  </div>
  <div class="chart-card">
    <h3>📊 Done Tickets by Member</h3>
    <div class="ch-sub">วันที่ ${todayStr} · อัปเดต ${now.toLocaleTimeString('th-TH')}</div>
    <div class="chart-wrap"><canvas id="myChart"></canvas></div>
  </div>
  <div class="lb-card">
    <h3>🏆 Leaderboard</h3>
    <div class="lb-sub">เรียงตามจำนวน Ticket Done วันนี้</div>
    ${sorted.length===0?'<div style="color:var(--muted);text-align:center;padding:30px">ยังไม่มี Ticket Done วันนี้</div>':
      sorted.map(([name,d],i)=>{
        const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
        const rl=i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
        const init=name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
        const pct=(d.count/maxCount*100).toFixed(1);
        return `<div class="lb-row">
          <div class="lb-rank ${rc}">${rl}</div>
          <div class="lb-avatar">${d.avatar?`<img src="${d.avatar}" onerror="this.parentElement.textContent='${init}'">`:`${init}`}</div>
          <div class="lb-info"><div class="lb-name">${name}</div><div class="lb-email">${d.email}</div></div>
          <div class="lb-bar-wrap"><div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${pct}%"></div></div></div>
          <div class="lb-count">${d.count}</div>
        </div>`;
      }).join('')}
  </div>`;

  document.getElementById('mainContent').innerHTML=html;

  if(chart)chart.destroy();
  const ctx=document.getElementById('myChart').getContext('2d');
  chart=new Chart(ctx,{
    type:'bar',
    data:{
      labels:sorted.map(e=>e[0].split(' ')[0]),
      datasets:[{label:'Done Tickets',data:sorted.map(e=>e[1].count),backgroundColor:colors,borderRadius:8,borderSkipped:false}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y} tickets`}}},
      scales:{
        x:{grid:{color:'#2e3155'},ticks:{color:'#8b8fa8'}},
        y:{grid:{color:'#2e3155'},ticks:{color:'#8b8fa8',stepSize:1},beginAtZero:true}
      }
    }
  });
}
</script>
</body>
</html>
